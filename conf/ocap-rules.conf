# ============================================================================
# OCAP Rule Definitions — loaded by OcapRuleStore at application startup
# ============================================================================
#
# Each rule is an entry under ocap.rules[]. The "condition" field uses the
# ExpressionParser DSL (supports >, <, >=, <=, BETWEEN, AND, OR, NOT, parens).
#
# Rules with a matching routeId are automatically assigned to that route
# during seedDefaultRoutes(). Rules with an empty routeId apply globally.

ocap {
  rules = [
    # ── PHOTOCELL-5WAFER: rework / scrap / notify ───────────────────
    {
      ruleId = "OCAP-001"
      routeId = "PHOTOCELL-5WAFER"
      name = "Borderline → Rework"
      condition = "cd_nm BETWEEN 34.0 AND 36.0"
      action = { type = "Rework", recipeId = "REWORK-LITHO-001", maxCount = 2 }
      priority = 1
    }
    {
      ruleId = "OCAP-002"
      routeId = "PHOTOCELL-5WAFER"
      name = "Far Out → Scrap"
      condition = "cd_nm > 42.0"
      action = { type = "Scrap", reason = "CD far out of spec" }
      priority = 0
    }
    {
      ruleId = "OCAP-003"
      routeId = "PHOTOCELL-5WAFER"
      name = "Borderline → Notify"
      condition = "cd_nm BETWEEN 34.0 AND 36.0"
      action = { type = "Notify", reason = "CD borderline", escalationPath = "area-engineer" }
      priority = 2
    }
    # ── SEND-AHEAD-PILOT: pilot failure → scrap ─────────────────────
    {
      ruleId = "OCAP-010"
      routeId = "SEND-AHEAD-PILOT"
      name = "Pilot Far Out → Scrap"
      condition = "cd_nm > 42.0"
      action = { type = "Scrap", reason = "Pilot CD far out of spec" }
      priority = 0
    }
    {
      ruleId = "OCAP-011"
      routeId = "SEND-AHEAD-PILOT"
      name = "Pilot Borderline → Notify"
      condition = "cd_nm BETWEEN 34.0 AND 36.0"
      action = { type = "Notify", reason = "Pilot CD borderline", escalationPath = "process-engineer" }
      priority = 1
    }
    # ── HOLD-RELEASE: hold on borderline ────────────────────────────
    {
      ruleId = "OCAP-020"
      routeId = "HOLD-RELEASE"
      name = "Borderline → Hold"
      condition = "cd_nm BETWEEN 34.0 AND 36.0"
      action = { type = "Hold", durationMs = 15000, reason = "CD borderline, engineer review required" }
      priority = 0
    }
    # ── Global / catch-all ──────────────────────────────────────────
    {
      ruleId = "OCAP-999"
      name = "Global: Far Out → Notify"
      condition = "cd_nm > 45.0"
      action = { type = "Notify", reason = "CD critically far out of spec", escalationPath = "senior-engineer" }
      priority = 99
    }
  ]
}
