@()
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>M3 Fab Demo — Closed-Loop Photo Cell Simulation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0d1117; --bg-alt: #161b22; --border: #30363d;
      --fg: #e6edf3; --fg-muted: #8b949e;
      --accent: #58a6ff; --amber: #f59e0b; --green: #3fb950;
      --red: #f85149; --purple: #a855f7;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--fg); line-height: 1.5;
    }
    /* Header */
    .header {
      background: rgba(13,17,23,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 0 20px;
      display: flex; align-items: center; height: 48px; gap: 16px;
    }
    .header .logo { font-weight: 700; font-size: 0.9rem; color: var(--fg); text-decoration: none; }
    .header nav { display: flex; gap: 8px; margin-left: auto; }
    .header nav a { color: var(--fg-muted); text-decoration: none; font-size: 0.78rem; padding: 4px 10px; border-radius: 4px; }
    .header nav a:hover { color: var(--fg); background: var(--bg-alt); }
    .header nav a.active { color: var(--amber); font-weight: 600; }

    /* Control Bar */
    .controls {
      display: flex; align-items: center; gap: 12px; padding: 10px 20px;
      background: var(--bg-alt); border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .controls button {
      background: var(--bg-alt); border: 1px solid var(--border); color: var(--fg);
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.78rem;
      transition: all 0.15s;
    }
    .controls button:hover { border-color: var(--fg-muted); }
    .controls button.primary { background: var(--amber); color: #000; border-color: var(--amber); font-weight: 600; }
    .controls button.danger { border-color: var(--red); color: var(--red); }
    .controls select {
      background: var(--bg-alt); border: 1px solid var(--border); color: var(--fg);
      padding: 6px 10px; border-radius: 6px; font-size: 0.78rem;
    }
    .controls label { font-size: 0.75rem; color: var(--fg-muted); display: flex; align-items: center; gap: 4px; }
    .controls input[type=range] { width: 80px; }

    /* Main Layout */
    .main { display: flex; flex-direction: column; height: calc(100vh - 90px); }

    /* Factory Floor */
    .factory-floor {
      flex: 1; min-height: 300px; background: #0a0e14;
      border-bottom: 1px solid var(--border); position: relative; overflow: hidden;
    }
    .factory-floor svg { width: 100%; height: 100%; }

    /* Bottom Panel */
    .bottom-panel {
      height: 220px; display: flex; border-top: 1px solid var(--border);
    }
    .timeline {
      flex: 2; overflow-y: auto; padding: 10px 16px;
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.7rem;
      background: var(--bg);
    }
    .timeline .entry { padding: 3px 0; border-bottom: 1px solid rgba(48,54,61,0.4); }
    .timeline .entry .ts { color: var(--fg-subtle); margin-right: 8px; }
    .timeline .entry.pass { color: var(--green); }
    .timeline .entry.fail { color: var(--red); }
    .timeline .entry.rework { color: var(--amber); }
    .timeline .entry.transport { color: var(--accent); }
    .summary {
      flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px;
      background: var(--bg-alt);
    }
    .summary h3 { font-size: 0.85rem; font-weight: 700; color: var(--fg-muted); margin-bottom: 4px; }
    .stat-row { display: flex; justify-content: space-between; font-size: 0.8rem; }
    .stat-row .label { color: var(--fg-muted); }
    .stat-row .value { font-weight: 600; }
    .stat-row .value.pass { color: var(--green); }
    .stat-row .value.fail { color: var(--red); }

    /* Equipment nodes in SVG */
    .eq-node { cursor: pointer; transition: opacity 0.3s; }
    .eq-node:hover { opacity: 0.85; }
    .eq-label { fill: var(--fg); font-size: 10px; font-weight: 600; text-anchor: middle; }
    .eq-status { font-size: 8px; text-anchor: middle; }
    .foup-icon { transition: transform 0.5s ease-in-out; }

    /* Classification wheel */
    .wafer-dot { transition: fill 0.3s; }
  </style>
</head>
<body>

<div class="header">
  <a href="/" class="logo">Reactive MES Kernel</a>
  <nav>
    <a href="/">Home</a>
    <a href="/saga">Saga</a>
    <a href="/dag">DAG</a>
    <a href="/m25-demo">M2.5+</a>
    <a href="/m3-demo">M3</a>
    <a href="/fab-demo" class="active">Fab Demo</a>
  </nav>
</div>

<div class="controls" id="controls">
  <button class="primary" onclick="startDemo()">▶ Start</button>
  <select id="scenarioSelect">
    <option value="photo-cell-5wafer">Photo Cell (5 wafers)</option>
  </select>
  <button onclick="pauseDemo()">⏸ Pause</button>
  <button onclick="resumeDemo()">▶ Resume</button>
  <label>Speed: <input type="range" id="speedSlider" min="1" max="10" value="1" oninput="adjustSpeed(this.value)"></label>
  <span id="speedLabel" style="font-size:0.75rem;color:var(--fg-muted)">1x</span>
  <button class="danger" onclick="injectFault('LITHO-01','hardware_fault')">⚡ Inject Fault</button>
</div>

<div class="main">
  <div class="factory-floor" id="factoryFloor">
    <svg id="factorySvg" viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowBlue" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
          <path d="M0,0 L6,2 L0,4 Z" fill="#58a6ff"/>
        </marker>
        <marker id="arrowAmber" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
          <path d="M0,0 L6,2 L0,4 Z" fill="#f59e0b"/>
        </marker>
      </defs>

      <!-- AMHS Rail -->
      <path d="M 120 100 L 300 100 L 300 200 L 500 200" stroke="#30363d" stroke-width="3" fill="none" stroke-dasharray="6 3"/>
      <path d="M 500 200 L 700 200" stroke="#30363d" stroke-width="3" fill="none" stroke-dasharray="6 3"/>
      <path d="M 500 200 L 500 280" stroke="#30363d" stroke-width="3" fill="none" stroke-dasharray="6 3"/>

      <!-- Stocker -->
      <g class="eq-node" id="eq-stocker">
        <rect x="50" y="70" width="70" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
        <text x="85" y="98" class="eq-label">Stocker</text>
        <text x="85" y="115" class="eq-status" id="status-stocker" fill="#6e7681">Idle</text>
      </g>

      <!-- Litho -->
      <g class="eq-node" id="eq-litho">
        <rect x="430" y="170" width="140" height="60" rx="8" fill="#161b22" stroke="#3b82f6" stroke-width="2"/>
        <text x="500" y="198" class="eq-label">Litho Scanner</text>
        <text x="500" y="215" class="eq-status" id="status-litho" fill="#6e7681">Idle</text>
      </g>

      <!-- CD-SEM -->
      <g class="eq-node" id="eq-cdsem">
        <rect x="630" y="170" width="140" height="60" rx="8" fill="#161b22" stroke="#8b5cf6" stroke-width="2"/>
        <text x="700" y="198" class="eq-label">CD-SEM</text>
        <text x="700" y="215" class="eq-status" id="status-cdsem" fill="#6e7681">Idle</text>
      </g>

      <!-- Decision Engine -->
      <g class="eq-node" id="eq-decision">
        <rect x="430" y="260" width="140" height="50" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="2"/>
        <text x="500" y="282" class="eq-label">Decision Engine</text>
        <text x="500" y="298" class="eq-status" id="status-decision" fill="#6e7681">Waiting</text>
      </g>

      <!-- FOUP icon -->
      <rect id="foupIcon" x="65" y="85" width="18" height="12" rx="2" fill="#f59e0b" opacity="0">
        <animate id="foupAnimX" attributeName="x" values="65" dur="1s" fill="freeze" begin="indefinite"/>
        <animate id="foupAnimY" attributeName="y" values="85" dur="1s" fill="freeze" begin="indefinite"/>
      </rect>

      <!-- Wafer classification wheel area -->
      <g transform="translate(820, 100)">
        <circle cx="40" cy="40" r="35" fill="none" stroke="#30363d" stroke-width="1.5"/>
        <text x="40" y="44" text-anchor="middle" font-size="9" fill="var(--fg-muted)">Wafers</text>
        <!-- 5 wafer dots -->
        <circle id="wd-0" cx="40" cy="20" r="4" fill="#30363d"/>
        <circle id="wd-1" cx="55" cy="28" r="4" fill="#30363d"/>
        <circle id="wd-2" cx="55" cy="52" r="4" fill="#30363d"/>
        <circle id="wd-3" cx="40" cy="60" r="4" fill="#30363d"/>
        <circle id="wd-4" cx="25" cy="52" r="4" fill="#30363d"/>
        <!-- Legend -->
        <text x="40" y="95" text-anchor="middle" font-size="7" fill="#3fb950">● PASS</text>
        <text x="40" y="108" text-anchor="middle" font-size="7" fill="#f59e0b">● BORDERLINE</text>
        <text x="40" y="121" text-anchor="middle" font-size="7" fill="#f85149">● FAIL/SCRAP</text>
      </g>
    </svg>
  </div>

  <div class="bottom-panel">
    <div class="timeline" id="timeline">
      <div class="entry"><span class="ts">--:--:--</span> Ready — select scenario and press Start</div>
    </div>
    <div class="summary" id="summary">
      <h3>Lot Summary</h3>
      <div class="stat-row"><span class="label">Active Wafers</span><span class="value" id="sum-active">-</span></div>
      <div class="stat-row"><span class="label">Passed</span><span class="value pass" id="sum-pass">-</span></div>
      <div class="stat-row"><span class="label">Reworked</span><span class="value" id="sum-rework" style="color:var(--amber)">-</span></div>
      <div class="stat-row"><span class="label">Scrapped</span><span class="value fail" id="sum-scrap">-</span></div>
    </div>
  </div>
</div>

<script src="@routes.Assets.versioned("javascripts/fab_demo.js")" type="text/javascript"></script>
</body>
</html>
