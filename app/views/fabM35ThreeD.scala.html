  .hint { font-size:11px; color:#6b7f95; margin-top:8px; line-height:1.5;

<script>
// 全局错误捕获——任何 JS 错误直接显示在页面上
window.onerror = function(msg, src, line, col) {
  var el = document.getElementById("errPanel");
  el.style.display = "block";
  el.textContent += "\n[ERROR] " + msg + "\n  at " + (src||"?").split("/").pop() + ":" + line + ":" + col + "\n";
};
window.addEventListener("unhandledrejection", function(e) {
  var el = document.getElementById("errPanel");
  el.style.display = "block";
  el.textContent += "\n[REJECTION] " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + "\n";
});
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
var dbg = function(msg) { var e = document.getElementById('dbgMsg'); if (e) e.textContent = msg; };
dbg('Three.js module loaded');

/* ===== 渲染器 / 场景 / 相机 ===== */
var container = document.getElementById('stage3d');
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);
dbg('renderer created');

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
scene.fog = new THREE.Fog(0x0b1220, 70, 190);

var camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
camera.position.set(-6, 27, 33);
var controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(-2, 2, -1);

scene.add(new THREE.AmbientLight(0xbfd4ff, 0.55));
var keyL = new THREE.DirectionalLight(0xffffff, 1.5);
keyL.position.set(20, 40, 18); keyL.castShadow = true; scene.add(keyL);
var fillL = new THREE.PointLight(0x88aaff, 0.45, 90);
fillL.position.set(-20, 16, -14); scene.add(fillL);

/* ===== 洁净室：九大工作区 + 物流环线 =====
   权威定义：fab-simulation/net/imadz/fab/model/EquipmentArea.scala
   9 工艺区（CLEAN/DIFF/LITHO/ETCH/IMPL/DEP/CMP/MET/DRY）+ STOCKER + LOG 物流指挥 */
var floor = new THREE.Mesh(new THREE.PlaneGeometry(84, 52),
  new THREE.MeshStandardMaterial({ color: 0x1a2634, roughness: 0.85 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
var gridH = new THREE.GridHelper(84, 84, 0x2a3b52, 0x1c2a3c);
gridH.position.y = 0.01; scene.add(gridH);
var wallMat = new THREE.MeshStandardMaterial({ color: 0x14202e, transparent: true, opacity: 0.35, roughness: 0.4 });
[[0, -26], [0, 26]].forEach(function(p) {
  var wall = new THREE.Mesh(new THREE.BoxGeometry(84, 6, 0.3), wallMat);
  wall.position.set(p[0], 3, p[1]); scene.add(wall);
});
[[-42, 0], [42, 0]].forEach(function(p) {
  var wall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 6, 52), wallMat);
  wall.position.set(p[0], 3, p[1]); scene.add(wall);
});
[-24, 24].forEach(function(z) {
  var truss = new THREE.Mesh(new THREE.BoxGeometry(82, 0.45, 0.8),
    new THREE.MeshStandardMaterial({ color: 0x37474f, metalness: 0.8, roughness: 0.3 }));
  truss.position.set(0, 5.6, z); scene.add(truss);
});

/* ===== 区域坐标与命名 ===== */
var AREA_POS = {
  STOCKER: new THREE.Vector3(-34, 0, 0),
  CLEAN:   new THREE.Vector3(-24, 0, -17),
  DIFF:    new THREE.Vector3(-12, 0, -17),
  LITHO:   new THREE.Vector3(0, 0, -17),
  ETCH:    new THREE.Vector3(12, 0, -17),
  IMPL:    new THREE.Vector3(24, 0, -17),
  DEP:     new THREE.Vector3(33, 0, 0),
  CMP:     new THREE.Vector3(24, 0, 17),
  MET:     new THREE.Vector3(12, 0, 17),
  DRY:     new THREE.Vector3(0, 0, 17),
  LOG:     new THREE.Vector3(0, 0, 0)
};
AREA_POS.METROLOGY = AREA_POS.MET;   // 后端别名
AREA_POS.CDSEM = AREA_POS.MET;       // 设备名别名
var AREA_NAME = {
  CLEAN: '湿法清洗', DIFF: '扩散/氧化', LITHO: '光刻', ETCH: '刻蚀',
  IMPL: '离子注入', DEP: '薄膜沉积', CMP: '化学机械抛光',
  MET: '量测', DRY: '干燥', LOG: '物流指挥', STOCKER: '晶圆仓库'
};
var EQUIP_BY_AREA = {};

/* ===== 建造辅助 ===== */
function mat(color, metal, rough) {
  return new THREE.MeshStandardMaterial({ color: color, metalness: metal, roughness: rough });
}
function lampFor(group, x, y, z) {
  var lamp = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10),
    new THREE.MeshStandardMaterial({ color: 0x0aa8a0, emissive: 0x0aa8a0, emissiveIntensity: 1.1 }));
  lamp.position.set(x, y, z); group.add(lamp); group.userData.lamp = lamp;
}
function labelSprite(text, x, y, z, accent) {
  var cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  var c = cv.getContext('2d');
  var sep = text.indexOf('·');
  var en = sep > 0 ? text.slice(0, sep).trim() : '';
  var cn = sep > 0 ? text.slice(sep + 1).trim() : text;
  var fontStack = '"Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif';
  c.fillStyle = 'rgba(9,15,25,0.78)';
  c.beginPath();
  var r = 20;
  c.moveTo(r, 0); c.lineTo(512 - r, 0); c.quadraticCurveTo(512, 0, 512, r);
  c.lineTo(512, 128 - r); c.quadraticCurveTo(512, 128, 512 - r, 128);
  c.lineTo(r, 128); c.quadraticCurveTo(0, 128, 0, 128 - r);
  c.lineTo(0, r); c.quadraticCurveTo(0, 0, r, 0);
  c.fill();
  c.fillStyle = accent; c.fillRect(14, 30, 8, 68);          // 左侧色条
  c.textAlign = 'left'; c.textBaseline = 'middle';
  if (en) { c.font = '500 30px ' + fontStack; c.fillStyle = 'rgba(143,184,232,0.95)'; c.fillText(en, 42, 40); }
  c.font = 'bold 50px ' + fontStack;
  c.fillStyle = '#eef4fb';
  c.shadowColor = 'rgba(0,0,0,0.9)'; c.shadowBlur = 6;
  c.fillText(cn, en ? 40 : 42, 92);
  c.shadowBlur = 0;
  var tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  sp.scale.set(7.0, 1.75, 1); sp.position.set(x, y, z);
  scene.add(sp);
}

/* ===== ① CLEAN 湿法清洗 —— 湿法台 + 冲洗槽 ===== */
(function() {
  var g = new THREE.Group();
  var bench = new THREE.Mesh(new THREE.BoxGeometry(6, 1.6, 2.4), mat(0x00695c, 0.5, 0.4));
  bench.position.y = 0.8; g.add(bench);
  for (var i = 0; i < 4; i++) {
    var tank = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.0, 1.8), mat(0x26c6da, 0.3, 0.2));
    tank.position.set(-2.1 + i * 1.4, 2.1, 0); g.add(tank);
  }
  lampFor(g, 0, 3.2, 0); g.position.copy(AREA_POS.CLEAN); scene.add(g);
  EQUIP_BY_AREA.CLEAN = g;
  labelSprite('CLEAN · 湿法清洗', AREA_POS.CLEAN.x, 4.6, AREA_POS.CLEAN.z, '#26c6da');
})();

/* ===== ② DIFF 扩散/氧化 —— 立式炉管阵 ===== */
(function() {
  var g = new THREE.Group();
  var base = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.5, 2.2), mat(0x4e342e, 0.4, 0.5));
  base.position.y = 0.25; g.add(base);
  for (var i = 0; i < 3; i++) {
    var tube = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 4.2, 14), mat(0xbf360c, 0.6, 0.35));
    tube.position.set(-1.5 + i * 1.5, 2.35, 0); g.add(tube);
  }
  lampFor(g, 0, 4.9, 0); g.position.copy(AREA_POS.DIFF); scene.add(g);
  EQUIP_BY_AREA.DIFF = g;
  labelSprite('DIFF · 扩散/氧化', AREA_POS.DIFF.x, 5.7, AREA_POS.DIFF.z, '#ff7043');
})();

/* ===== ③ LITHO 光刻 —— Stepper ===== */
(function() {
  var g = new THREE.Group();
  var body = new THREE.Mesh(new THREE.BoxGeometry(5, 3.4, 3), mat(0x283593, 0.6, 0.35));
  body.position.y = 1.7; body.castShadow = true; g.add(body);
  var win = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.1),
    new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x40c4ff, emissiveIntensity: 0.9 }));
  win.position.set(0, 2.2, 1.52); g.add(win); g.userData.panel = win;
  lampFor(g, 0, 4.1, 0); g.position.copy(AREA_POS.LITHO); scene.add(g);
  EQUIP_BY_AREA.LITHO = g;
  labelSprite('LITHO · 光刻', AREA_POS.LITHO.x, 4.9, AREA_POS.LITHO.z, '#40c4ff');
})();

var trackMat = new THREE.MeshStandardMaterial({ color: 0x546e7a, metalness: 0.8, roughness: 0.3 });

/* 每个区域在环线上的参数（最近采样点） */
var RING_SAMPLES = 512;
var ringSamples = trackCurve.getSpacedPoints(RING_SAMPLES);
var AREA_T = {};
['STOCKER', 'CLEAN', 'DIFF', 'LITHO', 'ETCH', 'IMPL', 'DEP', 'CMP', 'MET', 'DRY', 'LOG']
  .forEach(function(k) {
    var best = 0, bd = Infinity;
    for (var i = 0; i <= RING_SAMPLES; i++) {
      var dx = ringSamples[i].x - AREA_POS[k].x, dz = ringSamples[i].z - AREA_POS[k].z;
      var d = dx * dx + dz * dz;
      if (d < bd) { bd = d; best = i; }
    }
    AREA_T[k] = best / RING_SAMPLES;
  });

/* ===== 工位状态屏（实时显示 待机/进站/加工中/完成/宕机） ===== */
var BOARDS = {};
var boardTimers = {};   // boardFlash 回落定时器（须在 boardSet 首次调用前赋值）
var BOARD_Y = { CLEAN: 4.6, DIFF: 5.7, LITHO: 4.9, ETCH: 5.1, IMPL: 4.4, DEP: 4.5,
                CMP: 4.6, MET: 4.3, DRY: 4.3, STOCKER: 6.8, LOG: 7.8 };
function boardSet(key, text, color) {
  var b = BOARDS[key]; if (!b) return;
  clearTimeout(boardTimers[key]);   // 新状态接管屏幕：作废任何待触发的“回落待机”定时器
  var c = b.ctx;
  var W = 512, H = 128;
  c.clearRect(0, 0, W, H);
  c.fillStyle = 'rgba(9,15,25,0.80)';
  c.beginPath();
  var r = 22;
  c.moveTo(r, 0); c.lineTo(W - r, 0); c.quadraticCurveTo(W, 0, W, r);
  c.lineTo(W, H - r); c.quadraticCurveTo(W, H, W - r, H);
  c.lineTo(r, H); c.quadraticCurveTo(0, H, 0, H - r);
  c.lineTo(0, r); c.quadraticCurveTo(0, 0, r, 0);
  c.fill();
  c.strokeStyle = color; c.lineWidth = 4; c.stroke();
  c.shadowColor = 'rgba(0,0,0,0.85)'; c.shadowBlur = 8;
  c.font = 'bold 56px "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif';
  c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, W / 2, H / 2 + 2);
  c.shadowBlur = 0;
  b.tex.needsUpdate = true;
}
function boardFlash(key, text, color, revertMs) {
  boardSet(key, text, color);
  clearTimeout(boardTimers[key]);
  boardTimers[key] = setTimeout(function() { boardSet(key, '待机', '#0aa8a0'); }, revertMs || 3000);
}

/* 上浮气泡：每区最多 3 条最近状态变更，向上飘散、3 秒淡出 */
var BUBBLES = {};
function bubblePush(key, text, color) {
  var list = BUBBLES[key];
  if (!list) return;
  var cv = document.createElement('canvas'); cv.width = 512; cv.height = 104;
  var c = cv.getContext('2d');
  var fontStack = '"Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif';
  c.fillStyle = 'rgba(11,19,31,0.88)';
  c.beginPath();
  var r = 24;
  c.moveTo(r, 0); c.lineTo(512 - r, 0); c.quadraticCurveTo(512, 0, 512, r);
  c.lineTo(512, 104 - r); c.quadraticCurveTo(512, 104, 512 - r, 104);
  c.lineTo(r, 104); c.quadraticCurveTo(0, 104, 0, 104 - r);
  c.lineTo(0, r); c.quadraticCurveTo(0, 0, r, 0);
  c.fill();
  c.strokeStyle = color; c.lineWidth = 4; c.stroke();
  c.font = 'bold 44px ' + fontStack;
  c.fillStyle = '#eef4fb'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = 'rgba(0,0,0,0.85)'; c.shadowBlur = 6;
  c.fillText(text, 256, 54);
  c.shadowBlur = 0;
  var tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.95, depthWrite: false, depthTest: false }));
  sp.scale.set(4.9, 1.0, 1);
  var p = AREA_POS[key];
  sp.position.set(p.x + (Math.random() * 0.8 - 0.4), (BOARD_Y[key] || 4.5) + 3.4, p.z);
  sp.renderOrder = 50;
  scene.add(sp);
  list.push({ sp: sp, tex: tex, born: performance.now() });
  while (list.length > 3) {   // 只留最近 3 条
    var old = list.shift();
    scene.remove(old.sp); old.sp.material.dispose(); old.tex.dispose();
  }
}
Object.keys(EQUIP_BY_AREA).forEach(function(k) {
  var cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  var tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));

  var ly = BOARD_Y[k] || 4.5;
  sp.position.set(AREA_POS[k].x, ly + 2.0, AREA_POS[k].z);
  scene.add(sp);
  BOARDS[k] = { cv: cv, ctx: cv.getContext('2d'), tex: tex };
  BUBBLES[k] = [];
  boardSet(k, '待机', '#0aa8a0');
});

var foupState = 'hidden';        // hidden | riding | docked | entering | inside | exiting
var lastPadKey = 'STOCKER';      // 当前所在工位（装卸端口）
var foupAnchor = new THREE.Vector3();
function liftFoup() { foupState = 'riding'; foup.visible = true; beaconColor(0xffb300); }
function dockFoup(areaKey) {
  lastPadKey = PADS[areaKey] ? areaKey : 'STOCKER';
  foupState = 'docked'; foup.visible = true;
  foupAnchor.copy(PADS[lastPadKey]); foupAnchor.y += 0.3;
  beaconColor(0x1a7f37);
}

  if (foupState !== 'docked' && foupState !== 'entering') return;
  foupState = 'entering';
  foupAnchor.copy(AREA_POS[areaKey]); foupAnchor.y += 1.4;
}
function exitFoup() {
  foupState = 'exiting'; foup.visible = true;
  foupAnchor.copy(PADS[lastPadKey]); foupAnchor.y += 0.3;
}

function handleSaga(d) {
  var op = d.operation || '', status = d.status || '';
  var suffix = op === 'MergeLot'
    ? (d.sourceLotId || '').split('-').pop().toUpperCase()
    : (d.targetLotId || '').split('-').pop().toUpperCase();
  var n = (d.relatedWaferIds || []).length || 1;
  var cn = lotMeta(suffix).name;
  if (status.indexOf('PREPARE') === 0) {
    feedAdd('📋 [TCC] ' + (op === 'SplitLot' ? '拆批' : op === 'MergeLot' ? '合批' : '报废') + ' Try（' + cn + ' ' + n + ' 片）');
    return;

  if (status.indexOf('FAILED') === 0) {
    feedAdd('❌ [TCC] ' + op + ' ' + status + '（' + cn + '）', true);
    banner('❌ Saga ' + (op === 'SplitLot' ? '拆批' : '合批') + ' 失败：' + status, 'crash');
    return;
  }
  if (status !== 'COMMITTED') return;
  var sagaKey = (d.transactionId || '') + '|' + op + '|' + suffix;
  if (seenSagaKeys[sagaKey]) return;   // 同一 TCC 事务的重复 COMMITTED（重试/重放）只计一次
  seenSagaKeys[sagaKey] = true;
  var wids = (d.relatedWaferIds || []).filter(isWaferName);
  if (op === 'SplitLot') {
    splitCount++; setKpi('kpiSplit', splitCount);
    spawnChildFoup(suffix);
    if (wids.length === (d.relatedWaferIds || []).length && wids.length > 0) {
      wids.forEach(function(w) { waferLoc[w] = suffix; });   // 片级迁移：主批 → 子批
    } else {
      childLots[suffix] = (childLots[suffix] || 0) + n;
      lotMainCount = Math.max(0, lotMainCount - n);
    }
    renderLotTree();
    banner('✂️ 拆批已提交：' + n + ' 片 → ' + cn, 'recovering');
    feedAdd('✂️ SplitLot COMMITTED → ' + cn + '（' + n + ' 片）');
    narrate('✂️', 'TCC 拆批提交：<b>' + n + ' 片</b> 移入 ' + cn, 3600);
  } else if (op === 'MergeLot') {
    mergeCount++; setKpi('kpiMerge', mergeCount);
    if (wids.length === (d.relatedWaferIds || []).length && wids.length > 0) {
      wids.forEach(function(w) { waferLoc[w] = 'main'; });   // 片级迁移：子批 → 主批
    } else {
      lotMainCount += childLots[suffix] || n;

    renderLotTree();
    banner('🧩 合批已提交：' + cn + ' 并回主批', 'done');
    feedAdd('🧩 MergeLot COMMITTED ← ' + cn + '（' + n + ' 片）');
    narrate('🧩', 'TCC 合批提交：' + cn + ' <b>' + n + ' 片</b> 并回主批', 3600);
  } else if (op === 'ScrapLot') {
    if (wids.length === (d.relatedWaferIds || []).length && wids.length > 0) {
      wids.forEach(function(w) { waferLoc[w] = 'SCRAP'; });
    }
    removeChildFoup(suffix);
    delete childLots[suffix];
    renderLotTree();
    feedAdd('🗑 ScrapLot COMMITTED（' + cn + '）', true);

         : (tf !== undefined ? tf : AREA_T.MET);
  moveQueue = [];

  if (tf !== undefined) {
    var s1 = (tf - curT + 1) % 1;
    if (s1 > 0.012) {                                  // 不在发货站：先正向赶到
      moveQueue.push({ t0: probe, span: s1, eta: Math.min(1100, 350 + s1 * 2400) });
      probe = tf;

  }
  var s2 = (tt - probe + 1) % 1;
  if (s2 <= 0.004) s2 += 1;                            // 同站目标 = 空跑一圈回本站
  moveQueue.push({ t0: probe, span: s2, eta: Math.max(800, Math.min(etaMs || 1600, 5200)) });

/* 故障率旋钮（chaos dial，仅 M3.5 用例） */
var faultSlider = document.getElementById('faultSlider');
var faultVal = document.getElementById('faultVal');
faultSlider.addEventListener('input', function() { faultVal.textContent = faultSlider.value + '%'; });
faultSlider.addEventListener('change', function() {
  fetch('/api/fab-demo/m35/fault-probability', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ probability: faultSlider.value / 100 }) });
});
document.getElementById('btnStart').addEventListener('click', function() {
  var sc = selEl.value;
  resetDemoState();
  currentScenario = sc;
  if (sc === 'm35') {
    fetch('/api/fab-demo/m35/start', {method: 'POST'});
    banner('🚀 M3.5 自愈演示启动中……', 'recovering');
  } else {
    fetch('/api/fab-demo/start/' + sc, {method: 'POST'});
    banner('🚀 用例启动：' + selEl.options[selEl.selectedIndex].text, 'recovering');
  }
});
btnCrashEl.addEventListener('click', function() {
  if (!window.__activeWo || selEl.value !== 'm35') return;
  fetch('/api/fab-demo/m35/inject-crash/' + window.__activeWo, {method: 'POST'});
  banner('⚡ 宕机已注入——断点续跑即将开始', 'crash');
});
var camBtn = document.getElementById('btnCam');
var followCam = false;         // 模式1：镜头追天车
var camMode = 2;               // 0 自由 / 1 跟随天车 / 2 剧情镜头（默认）
camBtn.textContent = '🎬 剧情镜头';
camBtn.addEventListener('click', function() {
  camMode = (camMode + 1) % 3;
  followCam = camMode === 1;
  camBtn.textContent = ['🎥 自由视角', '🎥 跟随 OHT', '🎬 剧情镜头'][camMode];
});

/* ===== 渲染循环 ===== */
var clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (!moveAnim && moveQueue.length && performance.now() >= departAt) {
    var leg = moveQueue.shift();
    moveAnim = { t0: leg.t0, span: leg.span, start: performance.now(), eta: leg.eta };
  }
  if (moveAnim) {
    var k = Math.min(1, (performance.now() - moveAnim.start) / moveAnim.eta);
    var ease = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    curT = (moveAnim.t0 + moveAnim.span * ease) % 1;
    oht.position.copy(trackCurve.getPointAt(curT));
    var tan = trackCurve.getTangentAt(curT);
    oht.rotation.y = Math.atan2(tan.x, tan.z);
    if (k >= 1) {
      curT = (moveAnim.t0 + moveAnim.span) % 1;
      moveAnim = null;
      beaconColor(moveQueue.length ? 0xffb300 : 0x1a7f37);
    }
  }
  /* FOUP 锚点追踪：骑行跟车 / 端口停靠 / 进出设备（缩放入腔） */
  var rideOffX = Object.keys(childFoups).length > 0 ? 0.35 : 0;
  if (foupState === 'riding') {
    foupAnchor.set(oht.position.x + rideOffX, oht.position.y - 0.92, oht.position.z);
  } else if (foupState === 'docked' || foupState === 'exiting') {
    foupAnchor.copy(PADS[lastPadKey] || PADS.STOCKER); foupAnchor.y += 0.3;
  } else if (foupState === 'entering' || foupState === 'inside') {
    foupAnchor.copy(AREA_POS[lastPadKey]); foupAnchor.y += 1.4;
  }
  foup.position.lerp(foupAnchor, foupState === 'riding' ? 0.35 : 0.07);
  var ts = (foupState === 'entering' || foupState === 'inside') ? 0.2 : 1;
  var ns = foup.scale.x + (ts - foup.scale.x) * 0.12;
  foup.scale.setScalar(ns);
  if (foupState === 'entering' && ns < 0.26) foupState = 'inside';
  foup.visible = (foupState !== 'hidden') && !(foupState === 'inside' && ns < 0.3);
  if (EQUIP_BY_AREA.LOG && EQUIP_BY_AREA.LOG.userData.radar)
    EQUIP_BY_AREA.LOG.userData.radar.rotation.y += 0.02;
  beacon.material.emissiveIntensity = 1.0 + Math.sin(performance.now() * 0.008) * 0.6;
  pulseRings.forEach(function(pr) {
    pr.t += 0.016;
    if (pr.t < 0 || pr.t > 1) { pr.mesh.visible = false; return; }
    pr.mesh.visible = true;
    pr.mesh.position.copy(pr.center);
    var rr = 1 + pr.t * 7;
    pr.mesh.scale.set(rr, rr, 1);
    pr.mesh.material.opacity = 0.85 * (1 - pr.t);
  });
  /* 上浮气泡：飘升 + 3 秒淡出 */
  var nowMs = performance.now();
  Object.keys(BUBBLES).forEach(function(k) {
    BUBBLES[k] = BUBBLES[k].filter(function(bub) {
      var age = (nowMs - bub.born) / 3000;
      if (age >= 1) { scene.remove(bub.sp); bub.sp.material.dispose(); bub.tex.dispose(); return false; }
      bub.sp.position.y += 0.014;
      bub.sp.material.opacity = 0.95 * (1 - age * age);
      return true;
    });
  });
  if (focusKey && AREA_POS[focusKey]) {
    focusArrow.visible = true;
    var ftop = focusTopY[focusKey] || 4.5;
    focusArrow.position.set(AREA_POS[focusKey].x, ftop + 1.4 + Math.sin(performance.now() * 0.005) * 0.3, AREA_POS[focusKey].z);
  } else focusArrow.visible = false;
  if (camMode === 1) {
    camera.position.lerp(new THREE.Vector3(oht.position.x + 4, 8, oht.position.z + 8), 0.04);
    controls.target.lerp(new THREE.Vector3(oht.position.x, 2, oht.position.z), 0.06);
  } else if (camMode === 2 && focusKey && AREA_POS[focusKey]) {
    controls.target.lerp(new THREE.Vector3(AREA_POS[focusKey].x, 2.2, AREA_POS[focusKey].z), 0.025);
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
