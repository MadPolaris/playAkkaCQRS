syntax = "proto3";

package net.imadz.infrastructure.proto;

option java_multiple_files = true;

// --- Events ---

message WaferCreatedPO {
  string lot_id = 1;
}

message WaferAssignedPO {
  string lot_id = 1;
}

message WaferTransferReservedPO {
  string transfer_id = 1;
  string target_lot_id = 2;
}

message WaferTransferCommittedPO {
  string transfer_id = 1;
  string target_lot_id = 2;
}

message WaferTransferReleasedPO {
  string transfer_id = 1;
}

message WaferScrappedPO {
  string reason = 1;
}

message WaferStatusChangedPO {
  string new_status = 1;
}

// --- Event Union ---

message WaferEventPO {
  oneof event {
    WaferCreatedPO waferCreated = 1;
    WaferAssignedPO waferAssigned = 2;
    WaferTransferReservedPO waferTransferReserved = 3;
    WaferTransferCommittedPO waferTransferCommitted = 4;
    WaferTransferReleasedPO waferTransferReleased = 5;
    WaferScrappedPO waferScrapped = 6;
    WaferStatusChangedPO waferStatusChanged = 7;
  }
}

// --- State Snapshot ---

message WaferStatePO {
  string wafer_id = 1;
  optional string lot_id = 2;
  string status = 3;
  optional string reserved_transfer_id = 4;
  optional string reserved_target_lot_id = 5;
}
