syntax = "proto3";

package net.imadz.infrastructure.proto;

option java_multiple_files = true;

// --- Events ---

message ProcessStartedPO {
  string lot_id = 1;
  repeated string wafer_ids = 2;
  int32 lot_size = 3;
}

message FoupLoadedPO {
  string foup_id = 1;
  string stocker_id = 2;
}

message TransportStartedPO {
  string foup_id = 1;
  string from_area = 2;
  string to_area = 3;
  int64 estimated_ms = 4;
}

message TransportCompletedPO {
  string foup_id = 1;
  string equipment_id = 2;
}

message EquipmentJobStartedPO {
  string equipment_id = 1;
  string recipe_id = 2;
}

message EquipmentJobCompletedPO {
  string equipment_id = 1;
  string job_id = 2;
  bool success = 3;
}

message WaferMeasuredPO {
  string wafer_id = 1;
  double cd_nm = 2;
}

message WaferClassifiedPO {
  string wafer_id = 1;
  string classification = 2;
  int32 rework_count = 3;
  double cd_value = 4;
}

message WafersSplitForReworkPO {
  repeated string rework_wafer_ids = 1;
  repeated string scrap_wafer_ids = 2;
  int32 iteration = 3;
}

message WafersReworkedPO {
  repeated string wafer_ids = 1;
}

message WafersSentAsPilotPO {
  repeated string wafer_ids = 1;
}

message WafersSampledPO {
  repeated string sample_ids = 1;
  repeated string skip_ids = 2;
}

message WafersHeldPO {
  repeated string wafer_ids = 1;
  string reason = 2;
}

message WafersReleasedPO {
  repeated string wafer_ids = 1;
}

message ProcessCompletedPO {
  string lot_id = 1;
  int32 pass_count = 2;
  int32 scrap_count = 3;
  int32 rework_count = 4;
}

// --- Event Union ---

message ProcessEventPO {
  oneof event {
    ProcessStartedPO processStarted = 1;
    FoupLoadedPO foupLoaded = 2;
    TransportStartedPO transportStarted = 3;
    TransportCompletedPO transportCompleted = 4;
    EquipmentJobStartedPO equipmentJobStarted = 5;
    EquipmentJobCompletedPO equipmentJobCompleted = 6;
    WaferMeasuredPO waferMeasured = 7;
    WaferClassifiedPO waferClassified = 8;
    WafersSplitForReworkPO wafersSplitForRework = 9;
    WafersReworkedPO wafersReworked = 10;
    WafersSentAsPilotPO wafersSentAsPilot = 12;
    WafersSampledPO wafersSampled = 13;
    WafersHeldPO wafersHeld = 14;
    WafersReleasedPO wafersReleased = 15;
    ProcessCompletedPO processCompleted = 11;
  }
}

// --- State Snapshot ---

message FabProcessStatePO {
  string process_id = 1;
  string lot_id = 2;
  repeated string wafer_ids = 3;
  int32 lot_size = 4;
  int32 pass_count = 5;
  int32 scrap_count = 6;
  int32 rework_count = 7;
  string phase = 8;
  repeated WaferClassResultPO wafer_classifications = 9;
}

message WaferClassResultPO {
  string wafer_id = 1;
  string classification = 2;
  double cd_value_nm = 3;
  int32 rework_count = 4;
}
